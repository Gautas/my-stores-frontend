services:
  - type: web
    name: my-stores-web
    runtime: static
    buildCommand: npm install && node -e "require('fs').writeFileSync('src/api-config.ts', 'export const API_URL = '+JSON.stringify(process.env.API_URL || 'https://my-stores-backend.onrender.com/api')+';')" && npm run build -- --configuration=${ANGULAR_CONFIGURATION:-production}
    staticPublishPath: dist/my-stores/browser
    envVars:
      - key: API_URL
        sync: false
      - key: ANGULAR_CONFIGURATION
        value: production
